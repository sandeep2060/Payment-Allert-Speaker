name: Build NewLine Payment Speaker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q NewLinePaymentSpeaker_Source.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/NewLinePaymentSpeaker
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewLine-Payment-Speaker-APK
          path: extracted/NewLinePaymentSpeaker/app/build/outputs/apk/debug/*.apk
