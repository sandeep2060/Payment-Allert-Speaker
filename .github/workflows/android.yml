
name: Build NewLine Payment Speaker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 5. Extract Android source ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          echo "Searching for Android source ZIP..."

          ZIP_FILE=""

          if [ -f "NewLinePaymentSpeaker_Source.zip" ]; then
            ZIP_FILE="NewLinePaymentSpeaker_Source.zip"
          else
            mapfile -t ZIP_FILES < <(
              find . -type f -iname "*.zip" \
                ! -path "./.git/*"
            )

            if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
              ZIP_FILE="${ZIP_FILES[0]}"
            elif [ "${#ZIP_FILES[@]}" -gt 1 ]; then
              echo "ERROR: Multiple ZIP files found:"
              printf '%s\n' "${ZIP_FILES[@]}"
              exit 1
            fi
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android source ZIP was not found."
            echo "Files available in repository:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extraction completed."

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      # 6. Find actual Android Gradle project
      - name: Detect Android project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            break
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            echo "Extracted directory structure:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          echo "Android project found: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Check Android project configuration
      - name: Validate Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking project configuration..."

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle file not found."
            exit 1
          fi

          echo "Gradle project configuration found."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found. Using installed Gradle."
          fi

      # 8. Build Android debug APK
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Android debug build..."

          if [ -f "gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

          echo "Android build completed."

      # 9. Verify APK
      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No debug APK was generated."
            exit 1
          fi

          echo "SUCCESS: $APK_COUNT APK file(s) generated."

      # 10. Upload APK to GitHub Actions
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Payment-Alert-Speaker-Debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
