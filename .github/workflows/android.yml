
name: Build NewLine Payment Speaker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q NewLinePaymentSpeaker_Source.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit(f"Missing Gradle file: {p}")

          s = p.read_text()
          marker = "    compileSdk = 35"
          if marker not in s:
              raise SystemExit("Could not find compileSdk line")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  marker,
                  marker + """

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build APK
        working-directory: extracted
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewLine-Payment-Speaker-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
